# Cut a release from a tag.
#
# Push `v0.5.0` and this builds the zip the Lab accepts, boots it, checks it
# against the Lab's rules, and publishes a GitHub Release with it attached.
# Then: Lab > my submissions > update release > v0.5.0.
#
#   git tag v0.5.0 && git push origin v0.5.0
#
# The version in the tag must match `version` in soundbase-plugin.json and
# package.json — bump and commit those first. `npm run release 0.5.0` does the
# bump, the tag and the release from your own machine instead, and needs a
# SoundBase checkout to pack with; this needs nothing but the runner. Either
# way is fine, and running the script does not make this workflow publish a
# second release: it stands down when the tag already has one.
#
# This is a starting point. Things you may want to add: a build step for a
# compiled driver, a matrix if you ship per-platform binaries, or signing.
#
name: Release

on:
  push:
    tags: ['v*']
  # Same build, no Release — for trying the workflow out without cutting one.
  workflow_dispatch:

permissions:
  contents: write # to create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # A tag can point at any commit, including one that never went through
      # CI. Re-run the checks rather than trust that it did.
      - name: Check the plugin is well-formed
        run: npm run doctor

      - name: Validate the manifest against the contract schema
        run: npm run manifest

      - name: Test
        run: npm test

      # Nothing installs dependencies on the user's machine, so they travel in
      # the zip — and dev dependencies have no business being in there.
      - name: Drop dev dependencies
        run: npm prune --omit=dev

      # Packs, boots the packed folder the way the installer's probe does, and
      # refuses anything the Lab would reject. On a tag it also insists the
      # manifest version matches the tag.
      - name: Pack the release zip
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            npm run pack:release -- --expect "${GITHUB_REF_NAME#v}"
          else
            npm run pack:release
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: dist/*.zip

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # `npm run release` cuts the tag and the Release together, so on that
          # path the Release is already here and correct. Do not fight it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already has a Release — leaving it alone"
            exit 0
          fi
          gh release create "$TAG" dist/*.zip \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
