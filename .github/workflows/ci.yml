# CI for a SoundBase plugin.
#
# Three things are checked, in increasing order of what they prove:
#
#   1. the manifest validates against the contract's own JSON schema
#   2. the test suite passes
#   3. the plugin actually boots, handshakes, and serves a trace over HTTP
#
# (3) is the one that catches what unit tests miss. A plugin that passes its
# tests but cannot complete the stdout handshake is invisible to SoundBase,
# and the failure looks like "my plugin does not appear" with nothing in the
# logs to explain it.
#
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # If your plugin talks to hardware, the OS matrix is still worth having:
        # path handling, process termination and line endings differ, and those
        # are exactly the bugs that reach users first.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          # `cache: npm` is a hard error when there is no lockfile to key on,
          # and a repository made from this template has none until someone
          # commits their first install. Cache from then on, not before.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install
        shell: bash
        # `npm ci` needs a lockfile; `npm install` writes one. Commit the
        # lockfile it produces and every later run takes the reproducible path.
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Check the plugin is well-formed
        run: npm run doctor

      - name: Validate the manifest against the contract schema
        run: npm run manifest

      - name: Test
        run: npm test

  boot:
    # Proving the plugin starts is cheap and independent of the test matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - name: Install
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Boot, handshake, and serve a trace
        run: npm run smoke
